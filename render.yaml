services:
  - type: web
    name: gas-tracker-api
    runtime: python
    python:
      version: "3.9"
    buildCommand: "./build.sh"
    startCommand: "gunicorn src.main:app --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT"
    envVars:
      - key: PYTHON_VERSION
        value: "3.9"
    staticAssets:
      - path: /static
        destination: static/
